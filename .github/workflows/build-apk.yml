          PAYLOAD

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Quran pages
        uses: actions/cache@v4
        with:
          path: |
            www/pages
            www/data
          key: quran-assets-v1

      - name: Download Mushaf images and Quran text
        run: |
          pip install pillow
          python scripts/fetch_assets.py

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android (permissions, bell, icon)
        run: python scripts/patch_android.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Stable signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk wird.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wird.apk --title "Wird APK" --notes "Latest build" --target ${{ github.sha }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wird-quran-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
